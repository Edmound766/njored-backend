[versions]
exposed = "1.3.0"
h2 = "2.4.240"
kotlin = "2.3.21"
logback = "1.5.34"
postgresql = "42.7.11"
flyway ="12.9.0"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-datetime = {module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed"}
exposed-json = {module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed"}
database-hikari = {group = "com.zaxxer", name = "HikariCP", version="7.1.0"}
database-h2 = { module = "com.h2database:h2", version.ref = "h2" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
flyway-core = {group = "org.flywaydb", name = "flyway-core", version.ref="flyway"}
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
database-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
