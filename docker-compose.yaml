services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=njored
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - njored_pg_data:/var/lib/postgresql/data
    networks:
      - njored_default
    restart: unless-stopped

  ktor-app:
    image: ktor-docker-image:latest
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=njored
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - njored_default
    restart: unless-stopped

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - njored_default
    restart: unless-stopped

networks:
  njored_default:
    driver: bridge

volumes:
  njored_pg_data:
